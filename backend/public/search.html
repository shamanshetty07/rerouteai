<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reroute · Train search</title>
<style>
  /* Visual language borrowed from integrous.in: pale paper, near-black ink, one coral accent,
     2px corners, serif display type, mono micro-labels and coral corner brackets on cards. */
  :root { --bg:#f4f4f4; --fg:#1c1c1c; --muted:#1c1c1c99; --card:#fff; --line:#1c1c1c33; --hover:#1c1c1c0d;
          --accent:#e85a6e; --accent-soft:#e85a6e1a; --on-accent:#fff; --ink:#1c1c1c; --on-ink:#fff; --ink-hover:#333;
          --err:#b42318; --radius:2px;
          --serif:Aleo, "Iowan Old Style", Georgia, serif;
          --sans:"Host Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
          --mono:"Azeret Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151515; --fg:#f3f3f3; --muted:#ffffff99; --card:#1c1c1c; --line:#ffffff33; --hover:#ffffff0d;
            --accent:#ef7586; --accent-soft:#e85a6e26; --on-accent:#1c1c1c; --ink:#f3f3f3; --on-ink:#1c1c1c; --ink-hover:#ddd;
            --err:#ff9a9a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 var(--sans); font-feature-settings:"kern","liga","calt"; }
  main { max-width:760px; margin:0 auto; padding:40px 16px 64px; }
  h1 { font:600 2.25rem/1.1 var(--serif); letter-spacing:-.01em; margin:0 0 24px; }
  h1::after { content:""; display:block; width:40px; height:2px; background:var(--accent); margin-top:12px; }
  .cad, .journey { background-image:linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent));
         background-repeat:no-repeat; background-size:12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px;
         background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%; }
  form, #auth-prompt, #saved-auth-prompt, .journey, table { background-color:var(--card); border:1px solid var(--line); border-radius:var(--radius); }
  form { padding:24px; display:grid; gap:20px; grid-template-columns:1fr 1fr; }
  .full { grid-column:1 / -1; }
  @media (max-width:560px) { form { grid-template-columns:1fr; } }
  label, legend { display:block; font:500 .6875rem/1.4 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:11px 12px; font:inherit; color:var(--fg); background:var(--card);
          border:1px solid var(--line); border-radius:var(--radius); transition:border-color .15s, box-shadow .15s; }
  input:hover { border-color:var(--fg); }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input:focus-visible { border-color:var(--accent); outline-offset:0; box-shadow:0 0 0 3px var(--accent-soft); }
  input[aria-invalid="true"] { border-color:var(--err); }
  .field { position:relative; }
  .station-field { position:relative; min-width:0; }
  .station-input-wrap { position:relative; }
  .station-input-wrap input { padding-right:36px; text-overflow:ellipsis; }
  .station-clear { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:28px; height:28px;
                   padding:0; line-height:1; font-size:1.25rem; color:var(--muted); background:none; border-radius:var(--radius); }
  .station-clear:hover { color:var(--fg); background:var(--hover); }
  .station-options { position:absolute; z-index:10; left:0; right:0; top:100%; margin:4px 0 0; padding:4px;
                     list-style:none; background:var(--card); border:1px solid var(--fg); border-radius:var(--radius);
                     max-height:min(320px, 50vh); overflow:auto; box-shadow:0 12px 32px rgb(0 0 0 / .14); }
  .station-options[hidden] { display:none; }
  .station-option { display:flex; flex-direction:column; padding:8px 10px; border-radius:var(--radius); cursor:pointer; }
  .station-name { font-weight:500; overflow-wrap:anywhere; }
  .station-sub { font:.75rem/1.4 var(--mono); color:var(--muted); }
  .station-option:hover { background:var(--hover); }
  .station-option.is-selected .station-name::after { content:" ✓"; color:var(--accent); }
  .station-option[aria-selected="true"] { background:var(--ink); color:var(--on-ink); }
  .station-option[aria-selected="true"] .station-sub, .station-option[aria-selected="true"] .station-name::after { color:inherit; opacity:.8; }
  .station-option[aria-disabled="true"] { opacity:.5; cursor:not-allowed; }
  .station-option[aria-disabled="true"]:hover { background:none; }
  .station-empty { padding:8px 10px; color:var(--muted); }
  .station-meta { margin:4px 0 0; min-height:1.25em; font-size:.8125rem; color:var(--muted); }
  .station-error, .field-error { margin:4px 0 0; font-size:.8125rem; color:var(--err); }
  .station-error[hidden], .field-error[hidden] { display:none; }
  .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .route { grid-column:1 / -1; display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:start; }
  .swap { margin-top:26px; width:40px; height:40px; padding:0; font-size:1.125rem; background:var(--card);
          color:var(--fg); border:1px solid var(--line); border-radius:var(--radius); transition:border-color .15s, color .15s, transform .2s; }
  .swap:hover { background:var(--card); color:var(--accent); border-color:var(--accent); }
  @media (max-width:560px) {
    .route { grid-template-columns:1fr; }
    .swap { margin:0 auto; transform:rotate(90deg); }
  }
  button { padding:11px 22px; font:500 .9375rem/1.2 var(--sans); color:var(--on-ink); background:var(--ink); border:1px solid var(--ink);
           border-radius:var(--radius); cursor:pointer; transition:background .18s, color .18s, border-color .18s; }
  button:hover:not(:disabled) { background:var(--ink-hover); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .button { display:inline-block; padding:11px 22px; border-radius:var(--radius); border:1px solid var(--ink);
            background:var(--ink); color:var(--on-ink); text-decoration:none; font-weight:500; transition:background .18s, color .18s; }
  .button:hover { background:var(--ink-hover); }
  .button.secondary { background:transparent; color:var(--fg); }
  .button.secondary:hover { background:var(--ink); color:var(--on-ink); }
  .button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #auth-prompt, #saved-auth-prompt { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:24px; margin-bottom:16px; }
  @media (max-width:560px) { #auth-prompt, #saved-auth-prompt { grid-template-columns:1fr; } }
  .auth-group h3 { margin:0 0 4px; font:600 1.125rem/1.3 var(--serif); }
  .auth-group p { margin:0 0 12px; color:var(--muted); font-size:.875rem; }
  .auth-links { display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .tabs { display:flex; gap:24px; margin:-8px 0 24px; border-bottom:1px solid var(--line); }
  .tabs a { padding:8px 0; margin-bottom:-1px; border-bottom:2px solid transparent; color:var(--muted); text-decoration:none;
            font:500 .75rem/1.4 var(--mono); text-transform:uppercase; letter-spacing:.08em; transition:color .15s, border-color .15s; }
  .tabs a:hover { color:var(--fg); }
  .tabs a[aria-current="page"] { color:var(--fg); border-bottom-color:var(--accent); }
  .tabs a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .view-title { font:600 1.5rem/1.2 var(--serif); margin:0 0 8px; }
  .journey-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-top:16px; }
  .journey-actions button { padding:7px 14px; font-size:.8125rem; }
  button.secondary { background:transparent; color:var(--fg); border:1px solid var(--fg); }
  button.secondary:hover:not(:disabled) { background:var(--ink); color:var(--on-ink); }
  button.danger { background:transparent; color:var(--err); border:1px solid var(--err); }
  button.danger:hover:not(:disabled) { background:var(--err); color:var(--card); }
  .action-note { font-size:.8125rem; color:var(--muted); }
  .action-note.error { color:var(--err); }
  #saved-list[aria-busy="true"] { opacity:.5; }
  #status { margin:20px 0 8px; color:var(--muted); font:.8125rem/1.5 var(--mono); }
  #status.error { color:var(--err); }
  table { width:100%; border-collapse:collapse; overflow:hidden; }
  th, td { text-align:left; padding:12px; border-bottom:1px solid var(--line); font-size:.9375rem; }
  th { color:var(--muted); font:500 .6875rem/1.4 var(--mono); text-transform:uppercase; letter-spacing:.08em; }
  tr:last-child td { border-bottom:0; }
  .scroll { overflow-x:auto; }
  fieldset.mode { grid-column:1 / -1; border:0; padding:0; margin:0; display:flex; gap:24px; flex-wrap:wrap; }
  fieldset.mode label { display:inline-flex; gap:8px; align-items:center; margin:0; color:var(--fg); font:500 .9375rem/1.4 var(--sans); text-transform:none; letter-spacing:0; }
  fieldset.mode input { width:auto; accent-color:var(--accent); }
  [hidden] { display:none !important; }
  #results[aria-busy="true"] { opacity:.5; }
  .retry { margin-left:12px; padding:4px 12px; }
  .journey { padding:20px; margin-bottom:16px; }
  .journey-head h3 { margin:0; font:500 .6875rem/1.4 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .journey-head p, .legs, .journey-warnings, .search-warnings { margin:0; }
  .journey-times { font:600 1.375rem/1.3 var(--serif); }
  .journey-meta { color:var(--muted); font:.8125rem/1.5 var(--mono); }
  .legs { list-style:none; padding:0; margin-top:14px; display:grid; gap:10px; }
  .leg { padding-left:12px; border-left:2px solid var(--accent); overflow-wrap:anywhere; }
  .transfer { padding-left:12px; color:var(--muted); font:.8125rem/1.5 var(--mono); }
  .journey-warnings, .search-warnings { margin-top:12px; padding-left:20px; color:var(--muted); font-size:.8125rem; }
  .search-warnings { margin-bottom:12px; }
</style>
</head>
<body>
<main>
  <h1>Reroute</h1>
  <nav class="tabs" aria-label="Sections">
    <a href="#search" data-view="search" aria-current="page">Search</a>
    <a href="#saved" data-view="saved">Saved journeys</a>
  </nav>

  <div id="search-view">

  <form id="search-form" class="cad" autocomplete="off" novalidate>
    <div class="route">
      <div data-station-field="from"></div>
      <button type="button" class="swap" data-swap aria-label="Swap source and destination">⇄</button>
      <div data-station-field="to"></div>
    </div>
    <fieldset class="mode">
      <legend class="visually-hidden">Search type</legend>
      <label><input type="radio" name="mode" value="alternatives" checked> Alternative journeys</label>
      <label><input type="radio" name="mode" value="direct"> Direct trains</label>
    </fieldset>
    <div>
      <label for="date">Date</label>
      <input id="date" name="date" type="date" required aria-describedby="date-error">
      <p class="field-error" id="date-error" data-date-error role="alert" hidden></p>
    </div>
    <div data-alt-only>
      <label for="time">Earliest departure</label>
      <input id="time" name="time" type="time" required aria-describedby="time-error">
      <p class="field-error" id="time-error" data-time-error role="alert" hidden></p>
    </div>
    <div data-alt-only>
      <label for="maxTransfers">Maximum transfers</label>
      <input id="maxTransfers" name="maxTransfers" type="number" min="0" max="4" step="1" value="2" aria-describedby="transfers-error">
      <p class="field-error" id="transfers-error" data-transfers-error role="alert" hidden></p>
    </div>
    <div style="align-self:end">
      <button id="submit" type="submit">Search</button>
    </div>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <section id="auth-prompt" aria-label="Sign in or sign up" hidden></section>
  <div class="scroll" id="results"></div>
  </div>

  <div id="saved-view" hidden>
    <h2 class="view-title">Saved journeys</h2>
    <p id="saved-status" role="status" aria-live="polite"></p>
    <section id="saved-auth-prompt" aria-label="Sign in or sign up" hidden></section>
    <div id="saved-list"></div>
  </div>
</main>

<script type="module" src="/assets/search.js"></script>
</body>
</html>
